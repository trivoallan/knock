# Repair (rebuild path) — upgrade OS packages from the internal mirror, on order.
# Decision: docs/architecture/decisions/0054-upgrade-packages-step.md
#
# Two lists. `transform:` is applied to every rebuild. `remediate:` is applied only to an
# operation the reconcile plan orders remediated: an orchestrator that judged the source
# digest adds `remediate: {epoch: ...}` to that operation in the plan it hands to
# `knock reconcile --apply-plan`, together with `--stage-to`, so the repaired image is held
# and judged again before `knock promote` places it. Without an order, `remediate:` does
# nothing; without `--stage-to`, an ordered operation is withheld.
#
# Here the import is copy-only (no `transform:`), so the remediation re-points the package
# sources itself before upgrading. `upgradePackages` without `rewritePackageSources` before
# it (in the transform or the remediation) is a validation error, so an upgrade can never
# reach a public repository. The step takes no parameter: the epoch comes with the order.
#
#   KNOCK_TRANSFORM_PACKAGE_MIRRORS='{"corp": {"apt": "https://mirror.corp/debian", "apk": "https://mirror.corp/alpine"}}'
#
apiVersion: knock.io/v1alpha1
kind: MirrorPolicy
metadata:
  name: redis-repaired
spec:
  artifactType: image
  source:
    registry: docker.io
    repository: library/redis
  imports:
    - name: v7
      owners:
        - group:default/data-platform     # stamped as io.knock.owners
      tags:
        includeRegex: "^7\\.2\\."
      remediate:
        - rewritePackageSources: { mirror: corp }      # name → KNOCK_TRANSFORM_PACKAGE_MIRRORS
        - upgradePackages: {}                          # epoch: from the plan's order
      destinations:
        - project: repaired
          repository: redis
